replicaCount: 1

image:
  repository: ghcr.io/josh-archer/interactive-node-controller
  pullPolicy: IfNotPresent
  tag: ''
  # Set the digest in consumer GitOps for an immutable image reference.
  digest: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  name: ''
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  bindAddress: ':8080'
  service:
    enabled: true
    port: 8080
healthProbe:
  bindAddress: ':8081'

leaderElection: true
taint:
  key: availability.interactive-node.io/state
  interactiveValue: interactive
  activeValue: active
  failClosedValue: unavailable
  staleAfter: 1m
  failClosed: true
