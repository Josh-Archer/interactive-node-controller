replicaCount: 1

image:
  repository: ghcr.io/josh-archer/interactive-node-controller
  pullPolicy: IfNotPresent
  tag: ''
  # Set the digest in consumer GitOps for an immutable image reference.
  digest: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  name: ''
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  bindAddress: ':8080'
  service:
    enabled: true
    port: 8080
healthProbe:
  bindAddress: ':8081'

leaderElection: true
taint:
  key: availability.interactive-node.io/state
  interactiveValue: interactive
  activeValue: active
  failClosedValue: unavailable
  staleAfter: 1m
  failClosed: true
  # Optional secondary key passed as --burst-taint-key. Leave this empty to
  # omit the flag and keep single-taint behavior. When set, the controller
  # applies <burstKey>=<failClosedValue>:NoSchedule while the node is not
  # fresh-idle and removes it while the node is fresh-idle. The value must be
  # a Kubernetes qualified name and must differ from taint.key.
  burstKey: ''

eviction:
  # Safe default: no Eviction API calls are made until both enabled is true
  # and audit is false. Candidates are always explicitly label opted-in.
  enabled: false
  audit: true
  protectedNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
  # Default per-node steady budget and burst for both classes, applied once
  # per budgetInterval. It is not reset on every reconcile. Class fields below
  # override it when set to a positive value. Zero class fields inherit this
  # count; global and burst then inherit that per-node count, so one process
  # stays within a single node's rate until the global budget is raised.
  maxPerReconcile: 1
  budgetInterval: 1m
  retryBackoff: 30s
  # Stable per-Pod-UID jitter added on top of retryBackoff or a longer API
  # Retry-After hint. The controller caps it at retryBackoff.
  retryJitter: 5s
  standard:
    perNode: 0
    global: 0
    interval: 0s
    burstPerNode: 0
    burstGlobal: 0
  lossy:
    perNode: 0
    global: 0
    interval: 0s
    burstPerNode: 0
    burstGlobal: 0
  evictableLabel: interactive-node-controller.io/evictable
