apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeactivities.availability.interactive-node.io
spec:
  group: availability.interactive-node.io
  scope: Namespaced
  names:
    kind: NodeActivity
    listKind: NodeActivityList
    plural: nodeactivities
    singular: nodeactivity
    shortNames: [nodeactivity, na]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [nodeName]
              x-kubernetes-validations:
                - rule: oldSelf == null || self.nodeName == oldSelf.nodeName
                  message: spec.nodeName is immutable after enrollment
              properties:
                nodeName:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                  description: Exact Kubernetes Node name enrolled by GitOps.
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [active, idle, unknown, stale]
                activity:
                  type: string
                  enum: [game, interactive, idle, unknown]
                reason:
                  type: string
                  maxLength: 1024
                observedAt:
                  type: string
                  format: date-time
                heartbeatAt:
                  type: string
                  format: date-time
                generation:
                  type: integer
                  format: int64
                  minimum: 0
                failClosed:
                  type: boolean
                managedTaint:
                  type: object
                  required: [key, value, effect]
                  properties:
                    key: {type: string}
                    value: {type: string}
                    effect: {type: string, enum: [NoSchedule, PreferNoSchedule]}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ['True', 'False', 'Unknown']}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
