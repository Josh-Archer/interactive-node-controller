name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned isolated API-server test assets
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20250517180713-32e5e9e948a5
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path 1.32.0)" >> "$GITHUB_ENV"
      - run: go test ./internal/controller -run 'Test(EnrollmentAPIIntegration|EvictionAPIPreconditions)$' -count=1 -v
  eviction-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Kind
        run: go install sigs.k8s.io/kind@v0.27.0
      - name: Exercise PodDisruptionBudget eviction behavior
        run: |
          trap 'kind delete cluster --name inc37' EXIT
          kind create cluster --name inc37 --image kindest/node:v1.32.0 --wait 60s
          kind export kubeconfig --name inc37 --kubeconfig "$RUNNER_TEMP/inc37-kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/inc37-kubeconfig"
          make test-kind
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: make verify
      - run: make build-linux-amd64
      - run: make build-controller
      - run: make docker-build
      - name: Upload Linux amd64 test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-activity-reporter-linux-amd64
          path: bin/node-activity-reporter-linux-amd64
          if-no-files-found: error
          retention-days: 7
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check ansible-core==2.18.*
      - run: make ansible-syntax
