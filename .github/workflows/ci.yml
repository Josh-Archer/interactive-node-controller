name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eviction-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned isolated API-server test assets
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20250517180713-32e5e9e948a5
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path 1.32.0)" >> "$GITHUB_ENV"
      - run: go test ./internal/controller -run '^TestEvictionAPIPreconditions$' -count=1 -v
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: azure/setup-helm@v4
      - run: make verify
      - run: make build-linux-amd64
      - run: make build-controller
      - run: make docker-build
      - name: Upload Linux amd64 test build
        uses: actions/upload-artifact@v4
        with:
          name: node-activity-reporter-linux-amd64
          path: bin/node-activity-reporter-linux-amd64
          if-no-files-found: error
          retention-days: 7
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check ansible-core==2.18.*
      - run: make ansible-syntax
