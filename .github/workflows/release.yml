name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  # OCI repository paths must be lowercase; the GitHub owner is Josh-Archer.
  IMAGE_NAME: josh-archer/interactive-node-controller
  CHART_REPOSITORY: oci://ghcr.io/josh-archer/charts
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          test -f Dockerfile
          test -f chart/Chart.yaml
          test -f chart/crds/availability.interactive-node.io_nodeactivities.yaml
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tag must be a semantic-version tag such as v0.1.0: $RELEASE_TAG" >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  publish-image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
      - name: Publish image digest in the workflow summary
        run: echo '### Container image' >> "$GITHUB_STEP_SUMMARY" && echo '\`ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}\`' >> "$GITHUB_STEP_SUMMARY"
  publish-chart:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: azure/setup-helm@v4
      - run: helm lint chart && helm package chart --version '${{ needs.prepare.outputs.version }}' --app-version '${{ needs.prepare.outputs.tag }}'
      - run: echo "$CHART_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          CHART_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the chart unless this immutable version already exists
        run: |
          if helm show chart ${{ env.CHART_REPOSITORY }}/interactive-node-controller --version '${{ needs.prepare.outputs.version }}' >/dev/null 2>&1; then
            echo 'Chart version already exists; retaining the immutable published artifact.'
          else
            helm push interactive-node-controller-${{ needs.prepare.outputs.version }}.tgz ${{ env.CHART_REPOSITORY }}
          fi
      - name: Publish chart reference in the workflow summary
        run: echo '### Helm chart' >> "$GITHUB_STEP_SUMMARY" && echo '\`${{ env.CHART_REPOSITORY }}/interactive-node-controller --version ${{ needs.prepare.outputs.version }}\`' >> "$GITHUB_STEP_SUMMARY"
  github-release:
    needs: [prepare, publish-image, publish-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          fi
