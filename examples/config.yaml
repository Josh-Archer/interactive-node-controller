agent:
  sample_interval: 5s
  heartbeat_interval: 15s
  stale_after: 1m
  fail_closed: true
  debounce:
    game_samples: 1
    interactive_samples: 2
    idle_samples: 3

signals:
  logind:
    enabled: true
    command: /usr/bin/loginctl
    graphical_types: [wayland, x11]
    timeout: 3s
  game_process:
    enabled: false
    proc_root: /proc
    names: []
    command_line_contains: []
  nvidia:
    enabled: false
    command: /usr/bin/nvidia-smi
    utilization_floor_percent: 20
    timeout: 3s

# Reporter destination:
# - stdout: prints JSON heartbeats to stdout (useful for standalone testing)
# - kubernetes: patches the status subresource of the enrolled NodeActivity
reporter:
  mode: kubernetes
  kubernetes:
    api_server: https://kubernetes.default.svc:443
    namespace: interactive-node-controller
    name: workstation-1
    token_file: /var/lib/node-activity-reporter/token
    ca_file: /var/lib/node-activity-reporter/ca.crt
    timeout: 10s
