---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-runner
  namespace: desktop-recovery-canary
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdb-runner
---
apiVersion: v1
kind: Pod
metadata:
  name: admission-probe
  namespace: desktop-recovery-canary
  labels:
    app.kubernetes.io/name: admission-probe
    app.kubernetes.io/part-of: desktop-recovery-canary
spec:
  restartPolicy: Never
  nodeSelector:
    availability.interactive-node.io/schedulable: "true"
  containers:
    - name: probe
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
