# Disposable and protected workloads for the desktop recovery canary.
#
# Copy this file into the consuming GitOps repository. Do not apply it from
# this repository. The namespace must not be kube-system, kube-public, or
# kube-node-lease. Sizes are requests. None of these Pods request a GPU;
# a live GPU sample is a separate opted-in disposable workload.
#
# The Kind harness adds control-plane and desktop-recovery.example/unrelated
# tolerations so the Pods can schedule on a Kind node. Those tolerations are
# not opt-in and are not part of this consumer manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lossy-runner
  namespace: desktop-recovery-canary
  labels:
    app.kubernetes.io/name: lossy-runner
    app.kubernetes.io/part-of: desktop-recovery-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lossy-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lossy-runner
        app.kubernetes.io/part-of: desktop-recovery-canary
        interactive-node-controller.io/evictable: "true"
        interactive-node-controller.io/allow-lossy-eviction: "true"
    spec:
      terminationGracePeriodSeconds: 3
      nodeSelector:
        availability.interactive-node.io/schedulable: "true"
      containers:
        - name: runner
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
---
