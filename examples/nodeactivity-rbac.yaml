# Least-privilege RBAC: Allows the host reporter to patch ONLY the status
# subresource of its own enrolled NodeActivity. Replace resourceNames with the
# exact enrolled resource name for your worker node.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelabdesktop-reporter
  namespace: interactive-node-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homelabdesktop-reporter
  namespace: interactive-node-controller
rules:
  - apiGroups: ["availability.interactive-node.io"]
    resources: ["nodeactivities/status"]
    resourceNames: ["homelabdesktop"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homelabdesktop-reporter
  namespace: interactive-node-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homelabdesktop-reporter
subjects:
  - kind: ServiceAccount
    name: homelabdesktop-reporter
    namespace: interactive-node-controller
