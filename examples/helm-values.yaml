# Environment-agnostic Helm values example for interactive-node-controller
image:
  repository: ghcr.io/josh-archer/interactive-node-controller
  # Pin by digest in production GitOps for immutable deployments:
  digest: sha256:40b00ee4215d468c019ebc41d944c630baaf39ffe7364353274d5a44dafa22b5

# Taint configuration
taint:
  key: availability.interactive-node.io/state
  interactiveValue: interactive
  activeValue: active
  failClosedValue: unavailable
  staleAfter: 1m
  failClosed: true
  # Optional. Empty omits --burst-taint-key and keeps single-taint behavior.
  # Set a qualified name that differs from taint.key, for example
  # availability.interactive-node.io/burst.
  burstKey: ''

# Safe opt-in eviction configuration (disabled by default)
eviction:
  enabled: false
  audit: true
  protectedNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
  # Per-node steady budget per budgetInterval for both classes. Not a
  # per-reconcile cap. Zero class budgets inherit this value; global and burst
  # then inherit the per-node allowance.
  maxPerReconcile: 1
  budgetInterval: 1m
  retryBackoff: 30s
  retryJitter: 5s
  standard:
    perNode: 0
    global: 0
    interval: 0s
    burstPerNode: 0
    burstGlobal: 0
  lossy:
    perNode: 0
    global: 0
    interval: 0s
    burstPerNode: 0
    burstGlobal: 0
  evictableLabel: interactive-node-controller.io/evictable

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
